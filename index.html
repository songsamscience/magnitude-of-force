<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="version" content="2.0">
<meta name="description" content="에어 테이블 위의 퍽을 여러 방향·크기의 힘으로 밀어 속력이 변하는 운동, 방향이 변하는 운동, 둘 다 변하는 운동을 만들어 보고, 자를 눌러 힘의 크기에 따라 모양이 변하는 정도를 비교하는 중학교 과학 가상실험실">
<meta property="og:title" content="송쌤과학 가상실험실 | 힘의 크기와 물체의 변화">
<meta property="og:description" content="같은 퍽이라도 어느 쪽으로, 얼마나 세게 미느냐에 따라 빨라지거나, 꺾이거나, 둘 다 변해요">
<meta property="og:type" content="website">
<meta name="theme-color" id="metaTheme" content="#101b28">
<title>송쌤과학 가상실험실 | 힘의 크기와 물체의 변화</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23101b28'/%3E%3Cpath%20d='M8%2044h10m6%200h6m6-4%206-8m4-8%205-9'%20fill='none'%20stroke='%238ea2b4'%20stroke-width='4'%20stroke-linecap='round'/%3E%3Ccircle%20cx='50'%20cy='16'%20r='8'%20fill='%235aa2ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>(function(){try{var t=localStorage.getItem('ssv-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}})();</script>
<style>
/* ═══════ 송쌤과학 중1 가상실험실 공통 껍데기 (체험버전 V2.11) ═══════
   ① 테마와 무관한 토큰 → ② 테마 토큰(두 블록, 같은 목록) → ③ 마감 기본층 → ④ 껍데기 부품
   실험실마다 달라지는 장면 토큰·배치는 각 실험실 src/app.css에 둔다. */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  --r-1:6px;--r-2:10px;--r-3:16px;--r-full:999px;        /* 작은 컨트롤 6 · 버튼·입력 10 · 패널·장면 16 · 상태 알약 full */
  --control-h:36px;--icon-size:18px;
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  --top-h:56px;--strip-h:0px;
  --light-angle:215deg;                                   /* 주 광원: 왼쪽 위 — UI 그림자는 오른쪽 아래로 */
  --brand-pink:#FFB7B2;--brand-ink:#3b1d1b;
  --yt-red:#ff0033;--yt-play:#ffffff;--ig-1:#feda75;--ig-2:#fa7e1e;--ig-3:#d62976;--ig-4:#4f5bd5;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0b131d;--surface-1:#101b28;--surface-2:#182636;
  --stage:#0e1a27;--stage-2:#132233;
  --text-1:#e8eff5;--text-2:#b0c0cf;--text-3:#8ea2b4;--line-1:#223445;--line-2:#34495d;
  --accent:#6fd3c1;--accent-strong:#9be7d9;--accent-soft:#163a3b;--on-accent:#08131c;--focus:#9be7d9;--scrim:#02070dcc;
  --danger:#ff9d8a;--danger-soft:#3b2322;--ok:#7ed7a0;--ok-soft:#1d3b32;--warn:#ffcf5c;--warn-soft:#3f3822;
  --data-1:#E69F00;--data-2:#56B4E9;--data-3:#2fbf92;--data-4:#CC79A7;
  --shadow-color:215 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#edf1f4;--surface-1:#fbfcfd;--surface-2:#e3eaf0;
  --stage:#f5f8fa;--stage-2:#e9eff4;
  --text-1:#132a3b;--text-2:#44596b;--text-3:#566b7e;--line-1:#d3dde5;--line-2:#b2c3d0;
  --accent:#0f6b60;--accent-strong:#0a5148;--accent-soft:#d5eeea;--on-accent:#ffffff;--focus:#0a5148;--scrim:#0b1a2680;
  --danger:#b3261e;--danger-soft:#fbe3df;--ok:#1d7a47;--ok-soft:#d8f0e2;--warn:#8a5a00;--warn-soft:#fff2c8;
  --data-1:#B07400;--data-2:#0072B2;--data-3:#007A5A;--data-4:#A6508A;
  --shadow-color:210 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .30);
  --edge-hi:0 0 #0000;
}
/* ③ 마감 기본층 (§6.8) */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent)}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--accent) 30%,transparent)}
input,textarea{caret-color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,canvas,video{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:90;padding:8px 12px;border-radius:var(--r-1);background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600}
.skip:focus{top:8px}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--text-1);background:var(--surface-0)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text-2)}
/* ⑤ 사용자 설정 존중 */
@media (prefers-reduced-motion:reduce){:root{--lift:0px}}
@media (prefers-contrast:more){:root[data-theme]{--line-1:var(--line-2);--text-3:var(--text-2)}}
@media (prefers-reduced-transparency:reduce){.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surface-1)!important}}

/* ═══ 몸체: 상단 막대 / 본문 / (휴대폰) 브랜드 띠 ═══ */
html,body{height:100%}
body{height:100dvh;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr) var(--strip-h);overflow:hidden}
.topbar{position:relative;z-index:30;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--line-1);min-width:0}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brandmark{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg.ic{width:17px;height:17px;stroke-width:2}
.word{font:700 13px/1 var(--font-ui);color:var(--text-1)}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none;flex:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:21px;height:21px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-1)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.social:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
.social:is(:hover,:focus-visible) .ig-line{stroke:url(#ig-grad)}.social:is(:hover,:focus-visible) .ig-dot{fill:var(--ig-3)}
.top-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 auto}
.top-title h1{font:700 15px/1.2 var(--font-ui);color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top-title .std{font:500 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.utilities{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.social:hover{background:var(--surface-2);color:var(--text-1)}}
main.app{position:relative;min-width:0;min-height:0;overflow:hidden;outline:none}

/* ═══ 버튼 계층: Primary / Secondary / Ghost / Icon ═══ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control-h);padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-4px 0}
.btn svg.ic{width:17px;height:17px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn.wide{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn:not(.primary):not(:disabled):hover{background:var(--surface-2)}
  .btn.primary:not(:disabled):hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn.ghost:hover{color:var(--text-1)}
}
/* 칩 · 세그먼트 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-1);font:500 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.chip::before{content:'';position:absolute;inset:-6px -2px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text-1);font-weight:700}
.chip[aria-pressed="true"]::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);order:-1}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--line-1)}
.seg button{position:relative;min-height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button::before{content:'';position:absolute;inset:-6px -1px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);font-weight:800;box-shadow:var(--edge-hi),0 1px 2px hsl(var(--shadow-color) / .18)}
@media (hover:hover) and (pointer:fine){.chip:hover{border-color:var(--text-2)}.seg button:not([aria-pressed="true"]):not([aria-selected="true"]):hover{color:var(--text-1)}}

/* 결과 저장 — 장면 모서리의 카메라 (Ghost/Icon 계층) */
.save-btn{position:relative;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 9px;border:1px solid var(--line-2);border-radius:var(--r-2);background:color-mix(in oklab,var(--surface-1) 88%,transparent);color:var(--text-1);font:600 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap;box-shadow:var(--edge-hi)}
.save-btn::before{content:'';position:absolute;inset:-5px}
.save-btn svg.ic{width:18px;height:18px}
.save-btn[aria-busy="true"]{opacity:.6;cursor:progress}
@media (hover:hover) and (pointer:fine){.save-btn:hover{background:var(--surface-2)}}
.shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:shutter .32s var(--ease-out);z-index:5;border-radius:inherit}
@keyframes shutter{0%{opacity:.55}100%{opacity:0}}

/* 판독값 — 라벨 · 큰 수 · 작은 단위 */
.readout{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.readout .v{font:800 26px/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-1)}
.readout .u{font:600 13px/1 var(--font-ui);color:var(--text-2)}
.lbl{font:600 12px/1.4 var(--font-ui);color:var(--text-2)}

/* 슬라이더 (네이티브 range + accent-color, 트랙 4px 이상 · 터치 44px) */
input[type="range"]{width:100%;height:44px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}

/* ═══ 대화상자 · 드로어 · 토스트 ═══ */
dialog{border:0;padding:0;color:var(--text-1);background:var(--surface-1)}
dialog::backdrop{background:var(--scrim)}
.modal{width:min(620px,calc(100vw - 32px));max-height:min(86dvh,760px);border-radius:var(--r-3);box-shadow:var(--edge-hi),var(--shadow-3)}
.modal[open]{display:flex;flex-direction:column}
.modal.narrow{width:min(420px,calc(100vw - 32px))}
.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:clamp(360px,32vw,460px);border-left:1px solid var(--line-1);box-shadow:var(--shadow-3)}
.drawer[open]{display:flex;flex-direction:column}
.drawer::backdrop{background:color-mix(in oklab,var(--scrim) 55%,transparent)}
.dialog-head{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 20px;border-bottom:1px solid var(--line-1);flex:none}
.dialog-head h2{font:800 18px/1.3 var(--font-ui);margin-right:auto}
.dialog-body{padding:16px 20px 22px;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
:is(dialog,[popover]).sheet{opacity:0;transform:translateY(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
:is(dialog[open],[popover]:popover-open).sheet{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{:is(dialog[open],[popover]:popover-open).sheet{opacity:0;transform:translateY(var(--lift))}}
.drawer.sheet{transform:translateX(24px)}
.drawer.sheet[open]{transform:none}
@starting-style{.drawer.sheet[open]{transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){.drawer.sheet,.drawer.sheet[open]{transform:none}}
.help-doc h3{font:700 15px/1.4 var(--font-ui);margin:18px 0 6px;color:var(--text-1)}
.help-doc h3:first-child{margin-top:0}
.help-doc p,.help-doc li{font-size:15px;line-height:1.7;color:var(--text-1)}
.help-doc ul,.help-doc ol{margin:0;padding-left:20px}
.help-doc li+li{margin-top:4px}
.help-doc .keys{line-height:2.2}
.brandblock{margin-top:16px;padding:12px 14px;border-radius:var(--r-2);background:var(--surface-2);font-size:13px;line-height:1.8;color:var(--text-1)}
.brandblock a{color:var(--text-1)}
.ver-line{margin-top:10px;font:500 12px/1 var(--font-ui);color:var(--text-2)}
/* 원리 카드 */
.tcard{padding:0 0 18px;border-bottom:1px solid var(--line-1);margin-bottom:18px}
.tcard:last-child{border-bottom:0;margin-bottom:0}
.tcard h3{font:800 18px/1.35 var(--font-ui);margin:0 0 8px}
.tcard figure{margin:0 0 10px;border-radius:var(--r-2);background:var(--stage);border:1px solid var(--line-1);overflow:hidden}
.tcard figure svg{display:block;width:100%;height:auto}
.tcard .def{font:700 15px/1.6 var(--font-ui);margin-bottom:6px}
.tcard p{font-size:15px;line-height:1.7;color:var(--text-1)}
.tcard p+p{margin-top:6px}
.tcard .link{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-1) var(--r-1) 0;font-size:15px;line-height:1.65}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--strip-h) + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;max-width:min(360px,calc(100vw - 24px));padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-2);box-shadow:var(--edge-hi),var(--shadow-2);font:500 13px/1.5 var(--font-ui);color:var(--text-1)}
.toast.error{border-color:var(--danger)}
.toast .toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer}
.textlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-1);font:600 13px/1 var(--font-ui);text-decoration:underline;text-underline-offset:3px;padding:10px 0}
.textlink .yt-ic{width:20px;height:20px;stroke:none}
.textlink .yt-ic .yt-body{fill:var(--yt-red)}.textlink .yt-ic .yt-play{fill:#fff}

/* ═══ 휴대폰 세로(≤600px): 브랜드·채널은 아래 브랜드 띠로, 위에는 제목 + 고정 세트 ═══ */
@media (max-width:600px){
  :root{--top-h:52px;--strip-h:40px}
  .topbar{padding:0 4px 0 12px;gap:6px}
  .topbar>.vdiv{display:none}
  .top-title .std{display:none}
  .top-title h1{font-size:15px}
  .brand{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--strip-h) + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);background:var(--surface-1);border-top:1px solid var(--line-1);justify-content:flex-start}
  .brand .social{width:44px;height:36px}
  .brand .social svg{width:18px;height:18px}
  .utilities .hsep{margin:0 2px}
  .icon-btn{width:40px;height:40px}

/* ═══════ 이 실험실 ═══════ */
/* 힘의 크기와 물체의 변화 — 넓은 장면(에어 테이블은 가로로 긴 운동) + 아래 계기 덱 */
:root[data-theme="dark"]{
  --force:#ff7b5c;--force-ink:#5a1a0e;
  --table:#16273a;--table-2:#1b3047;--rail:#2c4258;--rail-hi:#3d5873;--hole:#2c4661;
  --puck-hi:#b7d7ff;--puck:#5aa2ff;--puck-lo:#1d4f95;--puck-cap:#dbe9ff;
  --dot-before:#9fb2c4;--dot-after:#5aa2ff;--ghost-dot:#8ea2b4;--guide:#6f879e;--zone:#ff7b5c;
  --desk-hi:#6b4a2f;--desk-lo:#4a321f;--desk-edge:#8a6440;
  --ruler:#e3d7a0;--ruler-edge:#a8995a;--ruler-ink:#3a3320;--clamp:#8d98a5;--clamp-lo:#56606b;--scale:#c7d2dc;--scale-ink:#0e1a27;
}
:root[data-theme="light"]{
  --force:#cf3a1c;--force-ink:#ffffff;
  --table:#e4ebf1;--table-2:#d6e0e8;--rail:#7d8e9f;--rail-hi:#a9b8c6;--hole:#b9c7d3;
  --puck-hi:#9ec8ff;--puck:#1f6fd1;--puck-lo:#0e3f80;--puck-cap:#e6f0ff;
  --dot-before:#5f7385;--dot-after:#1f6fd1;--ghost-dot:#8a9cad;--guide:#7d90a2;--zone:#cf3a1c;
  --desk-hi:#c89b66;--desk-lo:#9a7045;--desk-edge:#6f4c2b;
  --ruler:#f3e7ae;--ruler-edge:#b9a860;--ruler-ink:#3a3320;--clamp:#8d98a5;--clamp-lo:#5f6a76;--scale:#fbfcfd;--scale-ink:#132a3b;
}

.lab{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
.stage-wrap{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--stage)}
.stage-head{display:flex;align-items:center;gap:14px;padding:10px 14px 0;flex:none;z-index:2}
.stage-head .tabs{flex:none}
.stage-goal{flex:1;min-width:0;font:500 15px/1.4 var(--font-ui);color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0}
.scene{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}

/* 에어 테이블 */
.tbl{fill:var(--table)}
.tbl-holes{fill:url(#holes)}
.hole{fill:var(--hole)}
.rail{fill:var(--rail)}
.rail-hi{fill:none;stroke:var(--rail-hi);stroke-width:.8}
.puck-hi-s{stop-color:var(--puck-hi)}.puck-s{stop-color:var(--puck)}.puck-lo-s{stop-color:var(--puck-lo)}
.puck{fill:url(#puckGrad);stroke:var(--puck-lo);stroke-width:.5}
.puck-cap{fill:var(--puck-cap);opacity:.55}
.puck-shadow{fill:#000;opacity:.18}
.puck-plan{fill:none;stroke:var(--guide);stroke-width:.6;stroke-dasharray:1.6 1.4}
.zone-line{stroke:var(--zone);stroke-width:.7;stroke-dasharray:2 2;opacity:.8}
.zone-t{fill:var(--force);font-size:var(--t12);font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--table);stroke-width:var(--h3,3px);stroke-linejoin:round}
.zone-t.start{text-anchor:start}
.guide{stroke:var(--guide);stroke-width:.6;stroke-dasharray:2 1.8;fill:none}
.dot-b{fill:var(--dot-before)}
.dot-a{fill:var(--dot-after)}
.dot-p{fill:var(--force)}
.gdot{fill:none;stroke:var(--ghost-dot);stroke-width:.5;opacity:.75}
.ang-arc{fill:none;stroke:var(--text-1);stroke-width:.6}
.ang-t{fill:var(--text-1);font-size:var(--t13);font-weight:800;paint-order:stroke;stroke:var(--table);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.v-t{fill:var(--text-1);font-size:var(--t12);font-weight:700;paint-order:stroke;stroke:var(--table);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.v-t.b{fill:var(--text-2)}
.legend{fill:var(--text-2);font-size:var(--t12);font-weight:500}
.legend.end{text-anchor:end}
.s-cap.mid{text-anchor:middle}
.f-body{stroke:var(--force);stroke-width:1.9;fill:none}
.f-tick{stroke:var(--force-ink);stroke-width:.7}
.f-head{fill:var(--force)}
.f-label{fill:var(--force);font-size:var(--t13);font-weight:800;paint-order:stroke;stroke:var(--table);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.string{stroke:var(--text-2);stroke-width:.5;stroke-dasharray:1.2 1}
.pin{fill:var(--text-2)}

/* 자 휘기 */
.wall-bg{fill:var(--stage)}
.desk{fill:url(#deskGrad);stroke:var(--desk-edge);stroke-width:.08}
.desk-hi-s{stop-color:var(--desk-hi)}.desk-lo-s{stop-color:var(--desk-lo)}
.ruler{fill:var(--ruler);stroke:var(--ruler-edge);stroke-width:.06}
.ruler-mark{stroke:var(--ruler-ink);stroke-width:.05}
.clamp{fill:var(--clamp);stroke:var(--clamp-lo);stroke-width:.08}
.clamp-lo{fill:var(--clamp-lo)}
.scale{fill:var(--scale);stroke:var(--line-2);stroke-width:.06}
.scale-tick{stroke:var(--scale-ink);stroke-width:.05}
.scale-t{fill:var(--scale-ink);font-size:var(--t12);font-weight:600;text-anchor:end;dominant-baseline:central;font-variant-numeric:tabular-nums}
.s-ghost{fill:none;stroke:var(--ghost-dot);stroke-width:.08;stroke-dasharray:.35 .3}
.drop-line{stroke:var(--force);stroke-width:.08}
.s-cap{fill:var(--text-2);font-size:var(--t12);font-weight:500}
.sf-body{stroke:var(--force);stroke-width:.34;fill:none}
.sf-head{fill:var(--force)}
.sf-label{fill:var(--force);font-size:var(--t13);font-weight:800;paint-order:stroke;stroke:var(--stage);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.drop-t{fill:var(--text-1);font-size:var(--t13);font-weight:800;paint-order:stroke;stroke:var(--stage);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}

/* 아래 계기 덱 */
.deck{display:grid;grid-template-columns:minmax(340px,1.35fr) minmax(250px,1fr) minmax(220px,1fr) minmax(250px,1.1fr);border-top:1px solid var(--line-1);background:var(--surface-1)}
.deck-s{grid-template-columns:minmax(300px,1.2fr) minmax(200px,.8fr) minmax(280px,1.2fr)}
.grp{padding:10px 16px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.grp+.grp{border-left:1px solid var(--line-1)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.lbl-note{font-weight:500;color:var(--text-2);margin-left:4px}
.dirseg{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:row}
.dirseg button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:44px;padding:3px 6px;font-size:12px}
.dirseg svg{width:28px;height:14px}
.dirseg button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.d-puck{fill:var(--puck)}.d-arr{stroke:var(--force);stroke-width:2;fill:none}.d-head{fill:var(--force)}.d-mv{stroke:var(--text-2);stroke-width:1.2;stroke-dasharray:2 1.5;fill:none}
.magtop{display:flex;align-items:baseline;justify-content:space-between}
.magtop .readout .v{font-size:26px}
.ticks{display:flex;justify-content:space-between;margin-top:-10px;font:500 12px/1 var(--font-ui);color:var(--text-2);padding:0 2px}
.go-row{display:flex;gap:8px;margin-top:auto}
.go-row .grow{flex:1;min-height:44px;font-size:15px}
.go-row .ghost{min-height:44px}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ghost-tog{min-height:28px;font-size:12px}
.res-kind{font:800 18px/1.35 var(--font-ui);color:var(--text-1);min-height:24px}
.res-kind.idle{font:500 15px/1.5 var(--font-ui);color:var(--text-2)}
.res-kind .tag{display:inline-flex;align-items:center;gap:6px}
.res-list{margin:0;display:grid;gap:4px}
.res-list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-1);padding:3px 0}
.res-list dt{font:600 13px/1.5 var(--font-ui);color:var(--text-2)}
.res-list dd{margin:0;font:700 15px/1.5 var(--font-ui);color:var(--text-1);text-align:right}
.res-note{font:400 13px/1.5 var(--font-ui);color:var(--text-1);min-height:20px}
.book{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.book li{display:grid;grid-template-columns:20px auto minmax(0,1fr);gap:8px;align-items:center;min-height:30px;padding:3px 8px;border-radius:var(--r-1);border:1px dashed var(--line-2)}
.book li.on{border-style:solid;background:var(--surface-2)}
.book li.done-row{display:block;border:0;padding:2px 0 0;min-height:0}
.book .bk-ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--text-2)}
.book li.on .bk-ic{background:var(--ok);border-color:var(--ok);color:var(--surface-1)}
.book .bk-ic svg{width:12px;height:12px;stroke-width:2.6}
.book .bk-n{font:700 13px/1.3 var(--font-ui);color:var(--text-1);white-space:nowrap}
.book .bk-d{font:500 12px/1.3 var(--font-ui);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-count{font:700 13px/1 var(--font-ui);color:var(--text-2)}
.book-done{font:500 12px/1.5 var(--font-ui);color:var(--text-1)}
.book li.done-row .textlink{padding:4px 0}
.big .v{font-size:34px}
#plot{width:100%;height:auto;max-height:140px}
.p-axis{stroke:var(--line-2);stroke-width:1}
.p-grid{stroke:var(--line-1);stroke-width:1}
.p-t{fill:var(--text-2);font:500 11px var(--font-ui);font-variant-numeric:tabular-nums}
.p-pt{fill:var(--force);stroke:var(--surface-1);stroke-width:1.5}
.p-now{fill:none;stroke:var(--force);stroke-width:1.5}
.p-trend{stroke:var(--text-2);stroke-width:1;stroke-dasharray:4 3}

@media (max-width:1180px){
  .deck{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
  .g-book{grid-column:1 / -1;border-left:0!important;border-top:1px solid var(--line-1)}
  .book{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  main.app{overflow:auto}
  .lab{height:auto;min-height:100%;grid-template-rows:auto auto}
  .stage-wrap{height:auto;position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line-1)}
  .stage-head{flex-wrap:wrap;padding:8px 10px 0;gap:8px}
  .stage-goal{order:3;flex-basis:100%;white-space:normal;font-size:13px}
  .stage-head .save-btn{margin-left:auto}
  .stage{aspect-ratio:344/188;flex:none}
  .lab[data-tab="shape"] .stage{aspect-ratio:52/23}
  .deck,.deck-s{grid-template-columns:minmax(0,1fr)}
  .grp+.grp{border-left:0;border-top:1px solid var(--line-1)}
  .book{grid-template-columns:minmax(0,1fr)}
  .g-res{order:-1}
  .deck .g-cond{order:-3}.deck .g-mag{order:-2}
}
@media (max-width:600px){
  .save-btn{width:44px;height:44px;padding:0;justify-content:center}

  .grp{padding:10px 12px 12px}

const SS = (() => {
  const $ = (s, r = document) => r.querySelector(s);

    book: '<path d="M12 6.6C10.4 5.1 7.9 4.5 3.5 4.5v14c4.4 0 6.9.6 8.5 2.1 1.6-1.5 4.1-2.1 8.5-2.1v-14c-4.4 0-6.9.6-8.5 2.1Z"/><path d="M12 6.6v14"/>',

  /* ── 테마 (§11 — 스위치는 html[data-theme] 하나) ── */

  /* ── 전체화면 ── */

      <h3>모형의 조건과 한계</h3>${h.model}

      <button class="btn" id="wipeBtn">${icon('trash')}이 실험실의 기록 모두 지우기</button>
      <div class="brandblock">🧪 송쌤과학 (Song Ssaem Science)<br>ⓒ 2026 송세호 | 아주중학교<br>📺 YouTube: <a href="${CHANNELS.yt}" target="_blank" rel="noopener noreferrer" aria-label="송쌤과학 유튜브 채널 (새 창)">@songsamscience</a>&nbsp; 📷 Instagram: <a href="${CHANNELS.ig}" target="_blank" rel="noopener noreferrer" aria-label="송쌤과학 인스타그램 (새 창)">@songsamscience</a><br>⚠ 무단 복제·상업적 이용 금지</div>
      <p class="ver-line">v${CFG.version} · ${CFG.date}</p></div>`, {
      onOpen: () => {
        $('#wipeBtn').onclick = () => openModal('기록을 모두 지울까요?', `<p>${h.wipe || '이 실험실의 기록과 진행 상태'}가 모두 지워져요. 테마 설정은 남아요.</p>
          <div class="dialog-actions"><button class="btn" data-close>그대로 두기</button><button class="btn primary" id="wipeYes">모두 지우기</button></div>`, {
          narrow: true, onOpen: () => {

  }

  /* ── 결과 저장 (§11): SVG 장면 복제 → 계산된 스타일 인라인 → 이미지 → 캔버스 + 정보 띠 → PNG ── */
  const INLINE_PROPS = ['fill', 'fill-opacity', 'fill-rule', 'stroke', 'stroke-width', 'stroke-opacity', 'stroke-dasharray', 'stroke-dashoffset', 'stroke-linecap', 'stroke-linejoin', 'stroke-miterlimit', 'opacity', 'font-family', 'font-size', 'font-weight', 'font-style', 'text-anchor', 'dominant-baseline', 'paint-order', 'stop-color', 'stop-opacity', 'display', 'visibility', 'letter-spacing', 'font-variant-numeric', 'mix-blend-mode', 'filter', 'clip-path', 'mask', 'transform', 'transform-origin', 'transform-box'];
  function inlineTree(src, dst) {
    if (src.nodeType !== 1) return;
    const cs = getComputedStyle(src);
    let st = '';
    for (const p of INLINE_PROPS) {
      const v = cs.getPropertyValue(p);
      if (p === 'transform' && (v === 'none' || !src.style.transform)) continue;   // CSS transform만 옮긴다(속성 transform은 그대로 있음)
      if ((p === 'transform-origin' || p === 'transform-box') && !src.style.transform) continue;
      if (v !== '' && v !== 'normal' && v !== 'none' || p === 'fill' || p === 'stroke' || (p === 'display' && v === 'none')) st += `${p}:${v};`;   // 숨긴 요소는 PNG에서도 숨긴다
    }
    dst.setAttribute('style', st); dst.removeAttribute('class');
    const a = src.children, b = dst.children;
    for (let i = 0; i < a.length && i < b.length; i++) inlineTree(a[i], b[i]);
  }
  function svgToImage(svg, outW, vbOverride) {
    const clone = svg.cloneNode(true);
    inlineTree(svg, clone);
    clone.querySelectorAll('[data-noexport]').forEach(e => e.remove());
    clone.querySelectorAll('[tabindex]').forEach(e => e.removeAttribute('tabindex'));
    const vb = vbOverride || svg.viewBox.baseVal;
    const outH = Math.round(outW * vb.height / vb.width);
    clone.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.width} ${vb.height}`);
    clone.setAttribute('width', outW); clone.setAttribute('height', outH); clone.setAttribute('xmlns', NS);
    clone.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    const data = new XMLSerializer().serializeToString(clone);
    const url = URL.createObjectURL(new Blob([data], { type: 'image/svg+xml;charset=utf-8' }));
    return new Promise((ok, no) => { const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); ok({ img, w: outW, h: outH }); }; img.onerror = e => { URL.revokeObjectURL(url); no(e); }; img.src = url; });
  }
  function wrapText(ctx, text, maxW) {
    const words = String(text).split(' '), lines = []; let line = '';
    for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
    if (line) lines.push(line);
    return lines;
  }
  const p2 = n => String(n).padStart(2, '0');
  async function capture() {
    const btn = $('#saveBtn');
    if (!btn || btn.offsetParent === null || btn.getAttribute('aria-busy') === 'true') return;
    const cap = CFG.capture && CFG.capture();
    if (!cap || !cap.svg) return;
    btn.setAttribute('aria-busy', 'true');
    const slow = setTimeout(() => toast('결과 이미지를 만드는 중이에요…'), 700);
    try {
      const css = getComputedStyle(document.documentElement), tok = n => css.getPropertyValue(n).trim();
      const svg = cap.svg, vb = cap.viewBox || svg.viewBox.baseVal;
      const r = svg.getBoundingClientRect(), fit = Math.min(r.width / svg.viewBox.baseVal.width, r.height / svg.viewBox.baseVal.height);
      const outW = Math.round(Math.min(2400, Math.max(1200, vb.width * fit * 2)));
      const g = await svgToImage(svg, outW, cap.viewBox);
      const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
      const k = outW / 1200, pad = 28 * k, font = n => `${n}px 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
      ctx.font = `500 ${font(17 * k)}`;
      const rightW = 300 * k, textW = outW - pad * 3 - rightW;
      const condL = wrapText(ctx, cap.cond, textW), stateL = wrapText(ctx, cap.state, textW);
      const bandH = pad * 2 + 50 * k + (condL.length + stateL.length) * 26 * k;
      cv.width = outW; cv.height = Math.round(g.h + bandH);
      ctx.fillStyle = tok(cap.bg || '--stage'); ctx.fillRect(0, 0, outW, g.h);
      ctx.drawImage(g.img, 0, 0, g.w, g.h);
      ctx.fillStyle = tok('--surface-1'); ctx.fillRect(0, g.h, outW, cv.height - g.h);
      ctx.fillStyle = tok('--line-2'); ctx.fillRect(0, g.h, outW, Math.max(1, k));
      let y = g.h + pad + 14 * k;
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = tok('--text-2'); ctx.font = `600 ${font(14 * k)}`; ctx.fillText('실험 결과 · 송쌤과학 가상실험실', pad, y);
      y += 30 * k; ctx.fillStyle = tok('--text-1'); ctx.font = `800 ${font(22 * k)}`; ctx.fillText(cap.title || CFG.title, pad, y);
      ctx.font = `500 ${font(17 * k)}`; ctx.fillStyle = tok('--text-1');
      for (const l of condL) { y += 26 * k; ctx.fillText(l, pad, y); }
      ctx.fillStyle = tok('--text-2');
      for (const l of stateL) { y += 26 * k; ctx.fillText(l, pad, y); }
      const now = new Date();
      ctx.textAlign = 'right'; let ry = g.h + pad + 30 * k; const rx = outW - pad;
      ctx.fillStyle = tok('--text-2'); ctx.font = `500 ${font(15 * k)}`;
      ctx.fillText(`${now.getFullYear()}-${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`, rx, ry); ry += 26 * k;
      ctx.fillText('© 송쌤과학 · @songsamscience', rx, ry);
      ctx.textAlign = 'left';
      const blob = await new Promise(ok => cv.toBlob(ok, 'image/png'));
      if (!blob) throw new Error('blob');
      const fname = `${CFG.file}_실험결과_${now.getFullYear()}${p2(now.getMonth() + 1)}${p2(now.getDate())}-${p2(now.getHours())}${p2(now.getMinutes())}.png`.replace(/[\\/:*?"<>|\s]/g, '');
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

    <figure><svg viewBox="0 0 300 80" role="img" aria-label="탁자 끝에 고정한 자를 누르면 휘어진다">
      <rect width="300" height="80" style="fill:var(--stage)"/><rect x="0" y="36" width="110" height="44" style="fill:var(--desk-lo)"/>
      <path d="M30 32H110L270 32V36H110 30Z" style="fill:none;stroke:var(--ghost-dot);stroke-width:1.2;stroke-dasharray:4 3"/>
      <path d="M30 32H110Q200 36 268 58L268 62Q200 40 110 36H30Z" style="fill:var(--ruler);stroke:var(--ruler-edge)"/>
      <line x1="266" y1="58" x2="266" y2="76" style="stroke:var(--force);stroke-width:3"/><path d="M266 80 261 71h10Z" style="fill:var(--force)"/>
    </svg></figure>
    <p class="def">힘은 물체의 모양도 변하게 해요. 누르는 힘이 클수록 자가 더 많이 휘어요.</p>
    <p>자처럼 힘을 없애면 원래 모양으로 돌아오는 성질을 탄성이라고 해요.</p>
    <p class="link">${P.pts.length >= 2 ? `기록한 점: ${P.pts.map(p => `${f1(p[0])} N → ${f1(p[1])} cm`).join(', ')}.` : '‘모양 변화’에서 누르는 힘을 여러 번 바꿔 그래프에 점을 찍어 보세요.'}</p></article>`;
}
const HELP = {
  how: `<ol><li><b>운동 상태 변화</b> — 처음 상태(움직이는 중/멈춰 있음), 힘의 방향, 힘의 크기를 고르고 <b>출발</b>을 눌러요. 퍽이 점선 자리에 오면 0.4초 동안 그 힘을 받아요. 0.2초마다 찍힌 점의 간격과 길의 꺾임으로 변화를 읽어요.</li>
    <li>속력만·방향만·둘 다 변하는 운동을 만들어 <b>변화 도감</b>을 채워요. 힘의 크기만 바꿔 다시 하면 흐린 점(직전 결과)과 비교돼요.</li>
    <li><b>모양 변화</b> — 자 끝을 누르는 힘을 바꾸고, 세워 둔 눈금자로 자 끝이 내려간 거리를 읽어요. <b>손 떼기</b>를 누르면 자가 돌아와요.</li></ol>`,
  keys: '실험 고르기 탭에 포커스: <kbd>←</kbd><kbd>→</kbd> · 힘의 크기 막대: <kbd>←</kbd><kbd>→</kbd> · <kbd>Space</kbd>(포커스가 버튼이 아닐 때) 출발',
  model: `<ul><li>에어 테이블은 마찰이 없다고 보았어요. 퍽 질량 1.0 kg, 움직이는 중일 때 처음 속력 1.0 m/s, 힘은 0.4초 동안 같은 크기로 작용해요.</li>
    <li>‘운동 방향·반대 방향·옆으로’는 힘의 방향이 0.4초 동안 고정돼요. ‘늘 옆으로(줄)’는 핀에 묶은 줄이 퍽을 당기는 것처럼 힘이 늘 운동 방향에 수직이에요(줄 반지름 = 질량×속력²÷힘). 0.4초 뒤에 줄을 놓아요.</li>
    <li>화살표 길이는 힘의 크기를 나타내요(1 N = 눈금 한 칸). 테이블 그림의 길이(cm)와는 다른 눈금이에요.</li>
    <li>속력은 0.1 m/s까지 보여요. 퍽이 테이블 가장자리에 닿으면 실험이 끝나요.</li>
    <li>자 휘기: 30 cm 플라스틱 자를 탁자 밖으로 20 cm 내밀어 고정했어요. 끝이 내려간 거리는 누르는 힘 1 N에 약 4.4 cm로, 작게 휘는 범위에서 힘에 비례한다고 보았어요.</li></ul>`,
  source: '<p>2022 개정 중학교 과학 ‘힘의 작용’ — [9과05-03] 알짜힘이 0이 아닐 때 물체의 운동 상태가 변함을 알고, 그 예를 조사하여 분류할 수 있다. (해설: 속력이 변하거나 운동 방향이 바뀌거나 두 가지가 모두 변하는 사례로 분류). 이전 판(세 칸 인포그래픽)의 ‘힘이 클수록 속력(km/h)이 커진다’는 표현을 ‘같은 시간 동안 힘이 클수록 속력의 변화가 커진다’로 바로잡았어요.</p>',
  wipe: '두 실험의 조건, 결과와 직전 결과, 변화 도감, 자 휘기 그래프의 점',
};

/* ═════════ 이벤트 · 시작 ═════════ */
function capture() {
  if (tab === 'motion') {
    const r = runs[runs.length - 1];
    return { svg: svgM, flashEl: $('#stage'), title: '힘의 크기와 물체의 변화 — 운동 상태 변화',
      cond: `조건: ${C.v0 > 0 ? `움직이는 퍽(처음 속력 ${f1(V0)} m/s)` : '멈춰 있는 퍽'} · 힘의 방향 ${DIRS[C.d]} · 힘의 크기 ${f1(C.F)} N · 0.4초 동안`,
      state: r ? `최근 결과(${condText(r.cond)}): ${KIND[r.cls.kind]} — 속력 ${$('#resSpeed').textContent} · 운동 방향 ${$('#resDir').textContent}` : '아직 출발하지 않았어요' };
  }
  return { svg: svgS, flashEl: $('#stage'), title: '힘의 크기와 물체의 변화 — 모양 변화',
    cond: `자 끝을 누르는 힘 ${f1(P.F)} N (30 cm 플라스틱 자, 탁자 밖 20 cm)`,
    state: `자 끝이 내려간 거리 ${f1(sag)} cm${P.pts.length ? ` · 기록: ${P.pts.map(p => `${f1(p[0])} N→${f1(p[1])} cm`).join(', ')}` : ''}` };
}
function bind() {
  $('#clrBtn').innerHTML = `${icon('trash')}점 지우기`;
  $('#releaseBtn').innerHTML = `${icon('undo')}손 떼기`;
  $('#tabSeg').addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) setTab(b.dataset.tab); });
  $('#tabSeg').addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setTab(tab === 'motion' ? 'shape' : 'motion'); $(`#tabSeg [data-tab="${tab}"]`).focus(); } });
  $('#startChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; C.v0 = +b.dataset.v0; if (C.v0 === 0 && C.d === 'turn') C.d = 'side'; trial = null; save(); syncDeck(); renderM(); });
  $('#dirSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.getAttribute('aria-disabled') === 'true') { toast(b.title); return; } C.d = b.dataset.d; save(); syncDeck(); if (!trial) renderM(); });
  $('#magRng').addEventListener('input', e => { C.F = +e.target.value; save(); syncDeck(); if (!trial) renderM(); });
  $('#goBtn').addEventListener('click', go);
  $('#clrBtn').addEventListener('click', () => { runs = []; trial = null; save(); renderResult(); renderM(); syncDeck(); announce('점과 결과를 지웠어요. 변화 도감은 그대로예요.'); });
  $('#ghostTog').addEventListener('click', () => { showGhost = !showGhost; save(); syncDeck(); renderM(); });
  $('#pressRng').addEventListener('input', e => setPress(+e.target.value, false));
  $('#pressRng').addEventListener('change', e => setPress(+e.target.value, true));
  $$('#deckS [data-p]').forEach(b => b.addEventListener('click', () => setPress(+b.dataset.p, true)));
  $('#releaseBtn').addEventListener('click', () => setPress(0, true));
  $('#plotClr').addEventListener('click', () => { P.pts = []; P.ghost = null; save(); renderPlot(); renderS(); });
}
buildM(); buildS(); bind();
SS.init({
  id: 'magnitude-of-force', title: '힘의 크기와 물체의 변화', file: '힘의크기와물체의변화', version: APP_VERSION, date: APP_DATE,
  help: HELP, theory, capture, onResize: sizeText,
  onKey: e => { if (e.key === ' ' && tab === 'motion' && !e.target.closest('button,input,a')) { e.preventDefault(); go(); } },
  onWipe: () => { C = { v0: 1, d: 'fwd', F: 3 }; book = { speed: null, dir: null, both: null }; runs = []; trial = null; showGhost = true; P = { F: 0, pts: [], ghost: null }; sag = 0; setTab('motion'); renderResult(); renderBook(); renderPlot(); renderM(); renderS(); },
});
setTab(tab); setPress(P.F, false); renderResult(); renderBook(); renderPlot();
SS.loop(step);
window.MagLab = { go, step: dt => step(dt), state: () => ({ C, runs, book, trial, P, sag, tab }), setC: o => { Object.assign(C, o); syncDeck(); renderM(); }, setTab, setPress };

</script>
